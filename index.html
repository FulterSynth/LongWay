<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Машини та Доставка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; color: #fff; padding: 15px;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 900px; }

  h1 { text-align: center; margin-bottom: 15px; font-size: 1.8em;
       text-shadow: 2px 2px 4px rgba(0,0,0,0.5); letter-spacing: 1px; }

  #loginScreen {
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    padding: 30px; border-radius: 16px; text-align: center;
    max-width: 400px; margin: 60px auto;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #loginScreen p { margin-bottom: 15px; }
  #loginScreen input {
    width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
    border: none; font-size: 1em; outline: none; color: #222;
  }

  .btn {
    background: #ff6b35; color: #fff; border: none; padding: 12px 22px;
    border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: 600;
    transition: transform 0.15s, background 0.15s; margin: 5px;
  }
  .btn:hover { transform: translateY(-2px); background: #ff8555; }
  .btn:disabled { background: #666; cursor: not-allowed; transform: none; }
  .btn-green { background: #2ecc71; }
  .btn-green:hover { background: #45d985; }
  .btn-red { background: #e74c3c; }
  .btn-red:hover { background: #f2665a; }

  #gameScreen { display: none; }

  .hud {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between;
    background: rgba(0,0,0,0.3); padding: 12px 16px; border-radius: 12px;
    margin-bottom: 15px;
  }
  .hud-item { font-size: 0.95em; }
  .hud-item b { color: #ffd700; }

  .map {
    background: rgba(0,0,0,0.25); border-radius: 16px; padding: 20px;
    position: relative; min-height: 380px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
  }

  .city {
    position: absolute; width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72em; text-align: center; cursor: pointer;
    transition: all 0.25s; padding: 4px; font-weight: 600;
  }
  .city:hover { background: rgba(255,255,255,0.3); transform: scale(1.08); }
  .city.target {
    background: #ff6b35; box-shadow: 0 0 20px #ff6b35;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .car {
    position: absolute; font-size: 1.6em; transition: all 1.5s ease-in-out;
    z-index: 10; font-weight: 700;
    background: #ff6b35; color: #fff; padding: 6px 10px; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  #log {
    background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px;
    margin-top: 15px; max-height: 120px; overflow-y: auto;
    font-size: 0.85em; line-height: 1.6;
  }
  #log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }

  #leaderboard {
    background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px;
    margin-top: 15px;
  }
  #leaderboard h3 { margin-bottom: 10px; }
  .lb-row { display: flex; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9em; }
  .lb-row.you { color: #ffd700; font-weight: bold; }

  .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1>Машини та Доставка</h1>

  <div id="loginScreen">
    <p>Введи своє ім'я водія:</p>
    <input id="playerName" maxlength="15" placeholder="Ім'я водія...">
    <button class="btn" id="loginBtn">Почати</button>
  </div>

  <div id="gameScreen">
    <div class="hud">
      <div class="hud-item">Гравець: <b id="hudName">—</b></div>
      <div class="hud-item">Гроші: <b id="hudMoney">0</b> грн</div>
      <div class="hud-item">XP: <b id="hudXP">0</b></div>
      <div class="hud-item">Доставок: <b id="hudDeliveries">0</b></div>
      <div class="hud-item">Рівень: <b id="hudLevel">1</b></div>
    </div>

    <div class="map" id="map"></div>

    <div class="actions">
      <button class="btn btn-green" id="deliverBtn">Взяти замовлення</button>
      <button class="btn" id="upgradeBtn">Апгрейд</button>
      <button class="btn btn-red" id="logoutBtn">Вийти</button>
    </div>

    <div id="log"></div>

    <div id="leaderboard">
      <h3>Рейтинг водіїв</h3>
      <div id="lbList"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGltUohufVAc-FMIbO1sIvpd6xWSiaKdU",
  authDomain: "uniquestone.firebaseapp.com",
  databaseURL: "https://uniquestone-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "uniquestone",
  storageBucket: "uniquestone.firebasestorage.app",
  messagingSenderId: "114557024409",
  appId: "1:114557024409:web:23f1e0ad213e9cf7d2e008",
  measurementId: "G-TZ6SZXTJTF"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CITIES = [
  { id: 'kyiv',    name: 'Київ',    x: 55, y: 25 },
  { id: 'lviv',    name: 'Львів',   x: 15, y: 40 },
  { id: 'odesa',   name: 'Одеса',   x: 55, y: 75 },
  { id: 'kharkiv', name: 'Харків',  x: 85, y: 30 },
  { id: 'dnipro',  name: 'Дніпро',  x: 70, y: 55 },
];

let state = {
  name: null,
  money: 0,
  xp: 0,
  deliveries: 0,
  truckLevel: 1,
  currentCity: 'kyiv',
  targetCity: null,
  busy: false,
};
let lbUnsub = null;

const $ = id => document.getElementById(id);

function log(msg) {
  const d = document.createElement('div');
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  $('log').prepend(d);
  while ($('log').children.length > 20) $('log').lastChild.remove();
}

$('loginBtn').onclick = async () => {
  const name = $('playerName').value.trim();
  if (name.length < 2) return alert("Ім'я мінімум 2 символи!");
  if (!/^[\wА-Яа-яЇїІіЄєҐґ\s]+$/.test(name)) return alert("Лише літери та цифри!");

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Завантаження...';

  try {
    const key = name.toLowerCase();
    const snap = await get(ref(db, `deliveryGame/players/${key}`));
    if (snap.exists()) {
      const data = snap.val();
      state = {
        name: data.name || name,
        money: data.money || 0,
        xp: data.xp || 0,
        deliveries: data.deliveries || 0,
        truckLevel: data.truckLevel || 1,
        currentCity: data.currentCity || 'kyiv',
        targetCity: null,
        busy: false,
      };
      log(`З поверненням, ${state.name}!`);
    } else {
      state = {
        name, money: 100, xp: 0, deliveries: 0,
        truckLevel: 1, currentCity: 'kyiv',
        targetCity: null, busy: false,
      };
      await set(ref(db, `deliveryGame/players/${key}`), {
        name, money: 100, xp: 0, deliveries: 0, truckLevel: 1,
        currentCity: 'kyiv', createdAt: Date.now()
      });
      log(`Вітаємо, ${name}! Ти отримав 100 грн на старт.`);
    }

    $('loginScreen').classList.add('hidden');
    $('gameScreen').style.display = 'block';
    $('hudName').textContent = state.name;
    buildMap();
    renderAll();
    startLeaderboard();
  } catch (e) {
    console.error(e);
    alert('Помилка Firebase: ' + e.message);
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Почати';
  }
};

function buildMap() {
  const map = $('map');
  map.querySelectorAll('.city, .car').forEach(el => el.remove());
  CITIES.forEach(c => {
    const el = document.createElement('div');
    el.className = 'city';
    el.id = 'city-' + c.id;
    el.style.left = c.x + '%';
    el.style.top  = c.y + '%';
    el.textContent = c.name;
    el.onclick = () => { if (!state.busy) log(`${c.name} — тут нічого не потрібно.`); };
    map.appendChild(el);
  });
  const car = document.createElement('div');
  car.className = 'car';
  car.id = 'car';
  car.textContent = 'Вантажівка';
  map.appendChild(car);
  positionCar();
}

function positionCar() {
  const car = $('car');
  if (!car) return;
  const c = CITIES.find(x => x.id === state.currentCity) || CITIES[0];
  car.style.left = `calc(${c.x}% - 20px)`;
  car.style.top  = `calc(${c.y}% - 40px)`;
}

function renderAll() {
  $('hudMoney').textContent = state.money;
  $('hudXP').textContent = state.xp;
  $('hudDeliveries').textContent = state.deliveries;
  $('hudLevel').textContent = state.truckLevel;
  positionCar();

  CITIES.forEach(c => {
    const el = $('city-' + c.id);
    if (!el) return;
    el.classList.toggle('target', state.targetCity === c.id);
  });
}

$('deliverBtn').onclick = async () => {
  if (state.busy) return;

  if (state.targetCity) {
    state.busy = true;
    $('deliverBtn').disabled = true;
    const dest = state.targetCity;
    state.currentCity = dest;
    positionCar();
    log(`Вирушив до ${cityName(dest)}...`);

    setTimeout(async () => {
      const reward = 50 + state.truckLevel * 25;
      const xpGain = 10 + state.truckLevel * 2;
      state.money += reward;
      state.xp += xpGain;
      state.deliveries += 1;
      state.targetCity = null;
      state.busy = false;
      $('deliverBtn').disabled = false;
      $('deliverBtn').textContent = 'Взяти замовлення';

      log(`Доставлено в ${cityName(dest)}! +${reward} грн, +${xpGain} XP`);
      renderAll();
      await savePlayer();
    }, 1600);
    return;
  }

  const available = CITIES.filter(c => c.id !== state.currentCity);
  const target = available[Math.floor(Math.random() * available.length)];
  state.targetCity = target.id;
  log(`Нове замовлення: доставити в ${target.name}!`);
  renderAll();
};

$('upgradeBtn').onclick = async () => {
  const cost = 200 * state.truckLevel;
  if (state.money < cost) return log(`Недостатньо грошей (потрібно ${cost} грн)`);
  if (state.truckLevel >= 10) return log('Максимальний рівень вантажівки!');

  state.money -= cost;
  state.truckLevel += 1;
  log(`Вантажівку покращено до рівня ${state.truckLevel}!`);
  renderAll();
  await savePlayer();
};

$('logoutBtn').onclick = () => {
  if (lbUnsub) lbUnsub();
  location.reload();
};

function cityName(id) { return (CITIES.find(c => c.id === id) || {}).name || id; }

async function savePlayer() {
  try {
    await update(ref(db, `deliveryGame/players/${state.name.toLowerCase()}`), {
      name: state.name,
      money: state.money,
      xp: state.xp,
      deliveries: state.deliveries,
      truckLevel: state.truckLevel,
      currentCity: state.currentCity,
      lastSeen: Date.now()
    });
  } catch (e) {
    console.error('savePlayer:', e);
    log('Не вдалося зберегти прогрес');
  }
}

function startLeaderboard() {
  const lbRef = ref(db, 'deliveryGame/players');
  lbUnsub = onValue(lbRef, snap => {
    const list = $('lbList');
    list.innerHTML = '';
    if (!snap.exists()) {
      list.innerHTML = '<div style="opacity:0.6">Поки нікого немає</div>';
      return;
    }
    const players = Object.entries(snap.val())
      .map(([k, v]) => ({ key: k, ...v }))
      .sort((a, b) => (b.xp || 0) - (a.xp || 0))
      .slice(0, 10);

    players.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row' + (p.key === state.name.toLowerCase() ? ' you' : '');
      row.innerHTML = `<span>${i + 1}. ${escapeHtml(p.name || p.key)}</span>
                       <span>${p.xp || 0} XP · ${p.deliveries || 0} доставок</span>`;
      list.appendChild(row);
    });
  }, err => console.error('LB:', err));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
</script>
</body>
</html>
