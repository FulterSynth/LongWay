<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kovel Delivery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #e0e0e0; font-size: 14px; line-height: 1.6;
    background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 8px;
    border: 1px solid #2a2a2a; backdrop-filter: blur(4px);
  }
  #hud .coins { color: #f0c040; font-weight: 700; font-size: 18px; }
  #hud .hint { color: #666; font-size: 11px; margin-top: 4px; }
  #auth {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #0d0d0d;
  }
  #auth .box {
    background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
    padding: 32px; width: 320px; max-width: 90vw;
  }
  #auth h1 { color: #e0e0e0; font-size: 22px; margin-bottom: 4px; }
  #auth .sub { color: #666; font-size: 12px; margin-bottom: 20px; }
  #auth input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: #0d0d0d; border: 1px solid #333; border-radius: 6px;
    color: #e0e0e0; font-size: 14px; outline: none;
  }
  #auth input:focus { border-color: #4a9eff; }
  #auth button {
    width: 100%; padding: 12px; margin-top: 4px;
    background: #4a9eff; border: none; border-radius: 6px;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #auth button:active { background: #357abd; }
  #auth .toggle { text-align: center; margin-top: 12px; }
  #auth .toggle a { color: #4a9eff; font-size: 12px; cursor: pointer; text-decoration: none; }
  #auth .err { color: #e05555; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <h1>🛴 Kovel Delivery</h1>
    <div class="sub">Доставляй. Заробляй. Рости.</div>
    <input id="username" placeholder="Логін" autocomplete="username">
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="handleAuth()">Увійти / Зареєструватись</button>
    <div class="toggle"><a onclick="clearError()">Вперше тут? Просто введи логін і пароль — акаунт створиться автоматично.</a></div>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="hud" style="display:none">
  <div>💰 <span class="coins" id="hud-coins">0</span></div>
  <div>🚚 <span id="hud-vehicle">Скутер</span></div>
  <div class="hint">WASD / стрілки — рух</div>
</div>

<canvas id="game"></canvas>

<script type="module">
// ===== FIREBASE (тільки config з твого файлу) =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGltUohufVAc-FMIbO1sIvpd6xWSiaKdU",
  authDomain: "uniquestone.firebaseapp.com",
  databaseURL: "https://uniquestone-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "uniquestone",
  storageBucket: "uniquestone.firebasestorage.app",
  messagingSenderId: "114557024409",
  appId: "1:114557024409:web:23f1e0ad213e9cf7d2e008"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== СТАН =====
let me = null;              // ім'я гравця
let coins = 0;
let myPos = { x: 450, y: 280 };
let otherPlayers = {};      // { name: {x,y,vehicle} }
let keys = {};

// ===== КАРТА (стилізований Ковель) =====
const MAP_W = 900, MAP_H = 560;

// Дороги: масив ліній {x1,y1,x2,y2, w}
const ROADS = [
  // Головні горизонтальні
  { x1: 0, y1: 180, x2: 900, y2: 180, w: 14 },
  { x1: 0, y1: 360, x2: 900, y2: 360, w: 14 },
  { x1: 0, y1: 480, x2: 900, y2: 480, w: 10 },
  // Головні вертикальні
  { x1: 200, y1: 0, x2: 200, y2: 560, w: 14 },
  { x1: 450, y1: 0, x2: 450, y2: 560, w: 16 },
  { x1: 700, y1: 0, x2: 700, y2: 560, w: 14 },
  // Другорядні
  { x1: 0, y1: 80, x2: 900, y2: 80, w: 6 },
  { x1: 0, y1: 280, x2: 900, y2: 280, w: 6 },
  { x1: 0, y1: 430, x2: 900, y2: 430, w: 6 },
  { x1: 100, y1: 0, x2: 100, y2: 560, w: 6 },
  { x1: 320, y1: 0, x2: 320, y2: 560, w: 6 },
  { x1: 560, y1: 0, x2: 560, y2: 560, w: 6 },
  { x1: 820, y1: 0, x2: 820, y2: 560, w: 6 },
];

// Річка Турія (приблизна, стилізована)
const RIVER = [
  { x: 50, y: 520 }, { x: 120, y: 470 }, { x: 180, y: 440 },
  { x: 260, y: 420 }, { x: 340, y: 380 }, { x: 400, y: 340 },
  { x: 480, y: 310 }, { x: 560, y: 290 }, { x: 640, y: 260 },
  { x: 720, y: 220 }, { x: 800, y: 190 }, { x: 860, y: 170 }
];

// Квартали (прямокутники між дорогами)
const BLOCKS = [
  { x: 110, y: 90, w: 80, h: 80 }, { x: 210, y: 90, w: 100, h: 80 },
  { x: 330, y: 90, w: 110, h: 80 }, { x: 460, y: 90, w: 90, h: 80 },
  { x: 570, y: 90, w: 120, h: 80 }, { x: 710, y: 90, w: 100, h: 80 },
  { x: 110, y: 190, w: 80, h: 80 }, { x: 210, y: 190, w: 100, h: 80 },
  { x: 330, y: 190, w: 110, h: 80 }, { x: 460, y: 190, w: 90, h: 80 },
  { x: 570, y: 190, w: 120, h: 80 }, { x: 710, y: 190, w: 100, h: 80 },
  { x: 110, y: 290, w: 80, h: 60 }, { x: 210, y: 290, w: 100, h: 60 },
  { x: 330, y: 290, w: 110, h: 60 }, { x: 460, y: 290, w: 90, h: 60 },
  { x: 570, y: 290, w: 120, h: 60 }, { x: 710, y: 290, w: 100, h: 60 },
  { x: 110, y: 370, w: 80, h: 50 }, { x: 210, y: 370, w: 100, h: 50 },
  { x: 330, y: 370, w: 110, h: 50 }, { x: 460, y: 370, w: 90, h: 50 },
  { x: 570, y: 370, w: 120, h: 50 }, { x: 710, y: 370, w: 100, h: 50 },
  { x: 110, y: 440, w: 80, h: 30 }, { x: 210, y: 440, w: 100, h: 30 },
  { x: 330, y: 440, w: 110, h: 30 }, { x: 460, y: 440, w: 90, h: 30 },
  { x: 570, y: 440, w: 120, h: 30 }, { x: 710, y: 440, w: 100, h: 30 },
];

// ===== CANVAS =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let camX = 0, camY = 0;

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ===== АВТОРИЗАЦІЯ =====
window.clearError = () => document.getElementById('err').textContent = '';

async function hash(s) {
  const b = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
}

window.handleAuth = async function() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('err');
  if (!u || !p) { err.textContent = 'Заповни всі поля'; return; }
  if (u.length < 3) { err.textContent = 'Логін мінімум 3 символи'; return; }
  if (p.length < 4) { err.textContent = 'Пароль мінімум 4 символи'; return; }

  err.textContent = '...';
  try {
    const h = await hash(p);
    const snap = await get(ref(db, 'users/' + u));
    if (snap.exists()) {
      if (snap.val().password !== h) { err.textContent = 'Невірний пароль'; return; }
    } else {
      await set(ref(db, 'users/' + u), {
        password: h,
        createdAt: Date.now(),
        coins: 0,
        vehicle: 0,
        x: 450, y: 280
      });
    }
    me = u;
    coins = snap.exists() ? (snap.val().coins || 0) : 0;
    myPos = { x: 450, y: 280 };
    document.getElementById('auth').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('hud-coins').textContent = coins;
    startGame();
  } catch(e) {
    err.textContent = 'Помилка: ' + e.message;
  }
};

// ===== ГРА =====
let lastTime = 0;
let onlineRef = null;

function startGame() {
  // Позиція в Firebase + presence
  const myRef = ref(db, 'online/' + me);
  set(myRef, { x: myPos.x, y: myPos.y, vehicle: 0, lastSeen: Date.now() });
  onDisconnect(myRef).remove();

  // Слухаємо всіх онлайн
  onlineRef = ref(db, 'online');
  onValue(onlineRef, snap => {
    otherPlayers = {};
    if (snap.exists()) {
      snap.val();
      Object.entries(snap.val()).forEach(([name, data]) => {
        if (name !== me && Date.now() - (data.lastSeen || 0) < 60000) {
          otherPlayers[name] = data;
        }
      });
    }
  });

  // Оновлюємо позицію в Firebase кожні 200мс
  setInterval(() => {
    if (me) update(ref(db, 'online/' + me), { x: myPos.x, y: myPos.y, lastSeen: Date.now() });
  }, 200);

  requestAnimationFrame(loop);
}

function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.1);
  lastTime = t;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    const speed = 180;
    myPos.x += (dx / len) * speed * dt;
    myPos.y += (dy / len) * speed * dt;
    myPos.x = Math.max(10, Math.min(MAP_W - 10, myPos.x));
    myPos.y = Math.max(10, Math.min(MAP_H - 10, myPos.y));
  }

  // Камера слідує
  camX += (myPos.x - camX - window.innerWidth / 2) * 0.08;
  camY += (myPos.y - camY - window.innerHeight / 2) * 0.08;
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(-camX, -camY);

  // Річка
  ctx.beginPath();
  ctx.moveTo(RIVER[0].x, RIVER[0].y);
  for (let i = 1; i < RIVER.length; i++) ctx.lineTo(RIVER[i].x, RIVER[i].y);
  ctx.strokeStyle = '#1a3a5a';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Квартали
  BLOCKS.forEach(b => {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#252525';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  // Дороги
  ROADS.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = r.w;
    ctx.lineCap = 'round';
    ctx.stroke();
    // розмітка
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 12]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Інші гравці
  Object.entries(otherPlayers).forEach(([name, p]) => {
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#888';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, p.x, p.y - 12);
  });

  // Я
  ctx.fillStyle = '#f0c040';
  ctx.beginPath();
  ctx.arc(myPos.x, myPos.y, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f0c040';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(me || '', myPos.x, myPos.y - 14);

  ctx.restore();
}

// ===== КЕРУВАННЯ =====
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Свайп (мобільний)
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!touchStart) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const len = Math.hypot(dx, dy) || 1;
  keys['a'] = dx < -10; keys['d'] = dx > 10;
  keys['w'] = dy < -10; keys['s'] = dy > 10;
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', () => {
  keys = {};
  touchStart = null;
}, { passive: true });

// Старт
document.getElementById('username').focus();
</script>
</body>
</html>
