<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="version" content="0.1.0">
<title>Win95 Clicker — v0.1.0</title>
<style>
    /* ===== RESET ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    /* ===== DESKTOP ===== */
    body {
        background: #008080;
        font-family: "MS Sans Serif", Tahoma, "Segoe UI", sans-serif;
        font-size: 12px;
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        position: relative;
    }

    /* ===== WINDOW ===== */
    .window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #808080 #808080 #dfdfdf;
        box-shadow: 2px 2px 0 #000;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 420px;
        max-height: calc(100vh - 40px);
        animation: winOpen 0.15s ease-out;
    }
    @keyframes winOpen {
        from { transform: scale(0.95); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
    }

    .title-bar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: #fff;
        padding: 3px 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: bold;
        font-size: 12px;
        flex-shrink: 0;
    }
    .title-bar .title-icon { font-size: 13px; }
    .title-bar .title-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-bar .win-controls { display: flex; gap: 2px; }
    .win-btn {
        width: 18px; height: 16px;
        background: #c0c0c0;
        border: 1px solid;
        border-color: #fff #000 #000 #fff;
        font-size: 10px;
        font-weight: bold;
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }
    .win-btn:active {
        border-color: #000 #fff #fff #000;
    }

    .menu-bar {
        background: #c0c0c0;
        padding: 1px 2px;
        display: flex;
        gap: 2px;
        border-bottom: 1px solid #808080;
        flex-shrink: 0;
    }
    .menu-bar span {
        padding: 2px 8px;
        cursor: default;
        font-size: 12px;
    }
    .menu-bar span:hover { background: #000080; color: #fff; }

    .window-body {
        padding: 10px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
    }
    .window-body::-webkit-scrollbar { width: 16px; }
    .window-body::-webkit-scrollbar-track { background: #dfdfdf; }
    .window-body::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
    }

    .status-bar {
        background: #c0c0c0;
        padding: 2px;
        display: flex;
        gap: 2px;
        border-top: 1px solid #fff;
        flex-shrink: 0;
    }
    .status-bar .panel {
        flex: 1;
        border: 1px inset #808080;
        padding: 2px 6px;
        font-size: 11px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
    .status-bar .panel.small { flex: 0 0 auto; min-width: 60px; }

    /* ===== FORM ELEMENTS ===== */
    .group-box {
        border: 2px groove #fff;
        padding: 10px 8px 8px;
        position: relative;
        margin-top: 8px;
    }
    .group-box::before {
        content: attr(data-label);
        position: absolute;
        top: -8px;
        left: 8px;
        background: #c0c0c0;
        padding: 0 4px;
        font-size: 11px;
        color: #000;
    }

    .form-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
    }
    .form-row label {
        font-size: 12px;
        min-width: 70px;
    }
    .input-field {
        flex: 1;
        padding: 3px 5px;
        font-family: "MS Sans Serif", Tahoma, sans-serif;
        font-size: 12px;
        background: #fff;
        color: #000;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        outline: none;
        min-width: 0;
    }
    .input-field:focus {
        outline: 1px dotted #000;
        outline-offset: -4px;
    }

    .btn {
        font-family: "MS Sans Serif", Tahoma, sans-serif;
        font-size: 12px;
        background: #c0c0c0;
        color: #000;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
        padding: 4px 14px;
        cursor: pointer;
        min-width: 75px;
        font-weight: 400;
    }
    .btn:active:not(:disabled) {
        border-color: #808080 #fff #fff #808080;
        padding: 5px 13px 3px 15px;
    }
    .btn:disabled {
        color: #808080;
        text-shadow: 1px 1px 0 #fff;
        cursor: default;
    }
    .btn.default {
        outline: 1px solid #000;
        outline-offset: -4px;
    }
    .btn-link {
        background: transparent;
        border: none;
        color: #0000ff;
        text-decoration: underline;
        cursor: pointer;
        font-size: 11px;
        padding: 2px 0;
        text-align: left;
        font-family: inherit;
    }
    .btn-link:hover { color: #ff0000; }

    .btn-row {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 4px;
        flex-wrap: wrap;
    }

    /* ===== LOGIN / REGISTER ===== */
    .auth-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 8px;
    }
    .auth-tab {
        flex: 1;
        padding: 5px 8px;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        text-align: center;
    }
    .auth-tab.active {
        background: #dfdfdf;
        border-color: #808080 #fff #fff #808080;
        font-weight: bold;
        padding: 6px 8px 4px;
    }

    .error-msg {
        background: #ffffcc;
        border: 1px solid #808080;
        padding: 4px 8px;
        font-size: 11px;
        color: #800000;
        margin-top: 6px;
        display: none;
    }
    .error-msg.show { display: block; }

    .info-msg {
        background: #ccffcc;
        border: 1px solid #808080;
        padding: 4px 8px;
        font-size: 11px;
        color: #006000;
        margin-top: 6px;
        display: none;
    }
    .info-msg.show { display: block; }

    .auth-footer {
        margin-top: 8px;
        text-align: center;
    }

    /* ===== GAME SCREEN ===== */
    #game-screen { display: none; }
    #game-screen.active { display: flex; }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }
    .stat-item {
        background: #dfdfdf;
        border: 1px inset #808080;
        padding: 4px 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        gap: 4px;
    }
    .stat-item .label { color: #000; }
    .stat-item .value {
        font-weight: bold;
        font-family: "Courier New", monospace;
        color: #000080;
        font-size: 12px;
    }

    /* ===== BIG CLICK BUTTON ===== */
    .click-area {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px 0;
    }
    #big-click {
        width: 180px;
        height: 140px;
        background: #c0c0c0;
        border: 4px solid;
        border-color: #fff #808080 #808080 #fff;
        box-shadow: 2px 2px 0 #808080;
        cursor: pointer;
        font-family: "MS Sans Serif", Tahoma, sans-serif;
        font-size: 14px;
        font-weight: bold;
        color: #000080;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    #big-click:active {
        border-color: #808080 #fff #fff #808080;
        box-shadow: none;
    }
    #big-click .big-emoji { font-size: 40px; line-height: 1; }
    #big-click .click-label { font-size: 11px; color: #000; }

    .float-text {
        position: fixed;
        pointer-events: none;
        font-weight: bold;
        font-size: 16px;
        color: #008000;
        text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        animation: floatUp 0.8s ease-out forwards;
        z-index: 9999;
        font-family: "Courier New", monospace;
    }
    @keyframes floatUp {
        0%   { opacity: 1; transform: translate(-50%, 0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -60px) scale(1.3); }
    }

    /* ===== DIALOG ===== */
    .dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
    }
    .dialog-overlay.active { display: flex; }
    .dialog {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #dfdfdf #808080 #808080 #dfdfdf;
        box-shadow: 2px 2px 0 #000;
        min-width: 280px;
        max-width: 360px;
        animation: winOpen 0.12s ease-out;
    }
    .dialog-body {
        padding: 14px 12px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 12px;
        line-height: 1.5;
    }
    .dialog-icon { font-size: 28px; flex-shrink: 0; }
    .dialog-text { flex: 1; }

    /* ===== MOBILE ===== */
    @media (max-width: 480px) {
        body { padding: 10px; }
        .window { max-height: calc(100vh - 20px); }
        #big-click { width: 160px; height: 120px; }
        .stats-grid { grid-template-columns: 1fr; }
        .form-row label { min-width: 60px; font-size: 11px; }
    }
</style>
</head>
<body>

<!-- ===== LOGIN WINDOW ===== -->
<div class="window" id="auth-window">
    <div class="title-bar">
        <span class="title-icon">🖱️</span>
        <span class="title-text">Win95 Clicker — Вхід</span>
        <div class="win-controls">
            <button class="win-btn" disabled>_</button>
            <button class="win-btn" disabled>□</button>
            <button class="win-btn" disabled>✕</button>
        </div>
    </div>
    <div class="menu-bar">
        <span>Файл</span>
        <span>Довідка</span>
    </div>
    <div class="window-body">
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Вхід</button>
            <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Реєстрація</button>
        </div>

        <div class="group-box" data-label="Обліковий запис">
            <div class="form-row">
                <label>Логін:</label>
                <input type="text" class="input-field" id="auth-username" autocomplete="username" maxlength="20">
            </div>
            <div class="form-row">
                <label>Пароль:</label>
                <input type="password" class="input-field" id="auth-password" autocomplete="current-password" maxlength="40">
            </div>
            <div class="form-row" id="confirm-row" style="display:none;">
                <label>Повторіть:</label>
                <input type="password" class="input-field" id="auth-password2" autocomplete="new-password" maxlength="40">
            </div>
        </div>

        <div class="error-msg" id="auth-error"></div>
        <div class="info-msg" id="auth-info"></div>

        <div class="btn-row">
            <button class="btn default" id="auth-submit" onclick="handleAuth()">Увійти</button>
        </div>

        <div class="auth-footer">
            <button class="btn-link" id="auth-switch-link" onclick="toggleAuthMode()">Ще немає акаунта? Зареєструватись</button>
        </div>
    </div>
    <div class="status-bar">
        <div class="panel" id="auth-status">Готово</div>
        <div class="panel small">v0.1.0</div>
    </div>
</div>

<!-- ===== GAME WINDOW ===== -->
<div class="window" id="game-screen">
    <div class="title-bar">
        <span class="title-icon">🖱️</span>
        <span class="title-text" id="game-title">Win95 Clicker</span>
        <div class="win-controls">
            <button class="win-btn" disabled>_</button>
            <button class="win-btn" disabled>□</button>
            <button class="win-btn" onclick="logout()" title="Вийти">✕</button>
        </div>
    </div>
    <div class="menu-bar">
        <span>Файл</span>
        <span>Гра</span>
        <span onclick="logout()">Вихід</span>
    </div>
    <div class="window-body">
        <!-- Stats -->
        <div class="group-box" data-label="Статистика">
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="label">💰 Монети:</span>
                    <span class="value" id="stat-coins">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">🖱️ Кліків:</span>
                    <span class="value" id="stat-clicks">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">⚡ За клік:</span>
                    <span class="value" id="stat-power">1</span>
                </div>
                <div class="stat-item">
                    <span class="label">👤 Гравець:</span>
                    <span class="value" id="stat-user">—</span>
                </div>
            </div>
        </div>

        <!-- Click area -->
        <div class="click-area">
            <button id="big-click" onclick="doClick(event)">
                <span class="big-emoji">💰</span>
                <span class="click-label">КЛІКНИ МЕНЕ</span>
            </button>
        </div>
    </div>
    <div class="status-bar">
        <div class="panel" id="game-status">Готово</div>
        <div class="panel small" id="save-status">—</div>
    </div>
</div>

<!-- ===== DIALOG ===== -->
<div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog">
        <div class="title-bar">
            <span class="title-icon">ℹ️</span>
            <span class="title-text" id="dialog-title">Повідомлення</span>
            <div class="win-controls">
                <button class="win-btn" disabled>_</button>
                <button class="win-btn" disabled>□</button>
                <button class="win-btn" onclick="closeDialog()">✕</button>
            </div>
        </div>
        <div class="dialog-body">
            <div class="dialog-icon" id="dialog-icon">ℹ️</div>
            <div class="dialog-text" id="dialog-text">—</div>
        </div>
        <div class="btn-row" style="padding: 0 12px 12px;">
            <button class="btn default" onclick="closeDialog()">OK</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const APP_VERSION = "0.1.0";
    const SAVE_INTERVAL_MS = 5000;

    const firebaseConfig = {
        apiKey: "AIzaSyDGltUohufVAc-FMIbO1sIvpd6xWSiaKdU",
        authDomain: "uniquestone.firebaseapp.com",
        databaseURL: "https://uniquestone-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "uniquestone",
        storageBucket: "uniquestone.firebasestorage.app",
        messagingSenderId: "114557024409",
        appId: "1:114557024409:web:23f1e0ad213e9cf7d2e008",
        measurementId: "G-TZ6SZXTJTF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== STATE =====
    let currentUser = "";
    let authMode = "login"; // "login" | "register"
    let gameState = {
        coins: 0,
        totalClicks: 0,
        clickPower: 1
    };
    let saveTimer = null;
    let isSaving = false;

    // ===== HELPERS =====
    function $(id) { return document.getElementById(id); }

    function formatNumber(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
        if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";
        return Math.floor(n).toString();
    }

    async function sha256(text) {
        const buf = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // ===== DIALOG =====
    window.showDialog = function(title, text, icon) {
        $("dialog-title").textContent = title;
        $("dialog-text").textContent = text;
        $("dialog-icon").textContent = icon || "ℹ️";
        $("dialog-overlay").classList.add("active");
    };
    window.closeDialog = function() {
        $("dialog-overlay").classList.remove("active");
    };

    // ===== AUTH UI =====
    window.switchAuthTab = function(tab) {
        authMode = tab;
        $("tab-login").classList.toggle("active", tab === "login");
        $("tab-register").classList.toggle("active", tab === "register");
        $("confirm-row").style.display = tab === "register" ? "flex" : "none";
        $("auth-submit").textContent = tab === "login" ? "Увійти" : "Зареєструватись";
        $("auth-switch-link").textContent = tab === "login"
            ? "Ще немає акаунта? Зареєструватись"
            : "Вже є акаунт? Увійти";
        clearMessages();
    };

    window.toggleAuthMode = function() {
        switchAuthTab(authMode === "login" ? "register" : "login");
    };

    function clearMessages() {
        $("auth-error").classList.remove("show");
        $("auth-info").classList.remove("show");
    }
    function showError(msg) {
        const el = $("auth-error");
        el.textContent = msg;
        el.classList.add("show");
        $("auth-info").classList.remove("show");
    }
    function showInfo(msg) {
        const el = $("auth-info");
        el.textContent = msg;
        el.classList.add("show");
        $("auth-error").classList.remove("show");
    }
    function setStatus(msg) { $("auth-status").textContent = msg; }

    // ===== AUTH LOGIC =====
    window.handleAuth = async function() {
        clearMessages();
        const username = $("auth-username").value.trim();
        const password = $("auth-password").value;
        const password2 = $("auth-password2").value;
        const btn = $("auth-submit");

        if (!username || !password) { showError("Заповніть усі поля!"); return; }
        if (username.length < 3) { showError("Логін має бути мінімум 3 символи!"); return; }
        if (username.length > 20) { showError("Логін занадто довгий (макс. 20)!"); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { showError("Логін: лише латиниця, цифри, _"); return; }
        if (password.length < 4) { showError("Пароль має бути мінімум 4 символи!"); return; }

        if (authMode === "register" && password !== password2) {
            showError("Паролі не співпадають!");
            return;
        }

        btn.disabled = true;
        setStatus("Обробка...");

        try {
            const hash = await sha256(password);
            const snap = await get(child(ref(db), `users/${username}`));

            if (authMode === "register") {
                if (snap.exists()) { showError("Такий користувач вже існує!"); return; }
                await set(ref(db, `users/${username}`), {
                    password: hash,
                    createdAt: Date.now(),
                    lastOnline: Date.now(),
                    clicker: {
                        coins: 0,
                        totalClicks: 0,
                        clickPower: 1
                    }
                });
                currentUser = username;
                try {
                    localStorage.setItem("w95_user", username);
                    localStorage.setItem("w95_hash", hash);
                } catch(e) {}
                setStatus("Акаунт створено");
                startGame();
            } else {
                if (!snap.exists()) { showError("Користувача не знайдено!"); return; }
                if (snap.val().password !== hash) { showError("Невірний пароль!"); return; }
                currentUser = username;
                try {
                    localStorage.setItem("w95_user", username);
                    localStorage.setItem("w95_hash", hash);
                } catch(e) {}
                try { await update(ref(db, `users/${username}`), { lastOnline: Date.now() }); } catch(e) {}
                setStatus("Вхід виконано");
                startGame();
            }
        } catch(e) {
            console.error(e);
            showError("Помилка: " + e.message);
            setStatus("Помилка");
        } finally {
            btn.disabled = false;
        }
    };

    // Enter key
    ["auth-username", "auth-password", "auth-password2"].forEach(id => {
        const el = $(id);
        if (el) el.addEventListener("keydown", e => { if (e.key === "Enter") handleAuth(); });
    });

    // ===== GAME LOGIC =====
    async function startGame() {
        $("auth-window").style.display = "none";
        $("game-screen").classList.add("active");
        $("stat-user").textContent = currentUser;
        $("game-title").textContent = "Win95 Clicker — " + currentUser;

        await loadGame();
        renderStats();

        if (saveTimer) clearInterval(saveTimer);
        saveTimer = setInterval(saveGame, SAVE_INTERVAL_MS);
    }

    async function loadGame() {
        try {
            const snap = await get(child(ref(db), `users/${currentUser}/clicker`));
            if (snap.exists()) {
                const data = snap.val();
                gameState = {
                    coins: Number(data.coins) || 0,
                    totalClicks: Number(data.totalClicks) || 0,
                    clickPower: Number(data.clickPower) || 1
                };
            } else {
                gameState = { coins: 0, totalClicks: 0, clickPower: 1 };
            }
        } catch(e) {
            console.error("loadGame:", e);
            showDialog("Помилка", "Не вдалося завантажити збереження: " + e.message, "⚠️");
        }
    }

    async function saveGame() {
        if (!currentUser || isSaving) return;
        isSaving = true;
        try {
            await update(ref(db, `users/${currentUser}/clicker`), {
                coins: gameState.coins,
                totalClicks: gameState.totalClicks,
                clickPower: gameState.clickPower
            });
            const now = new Date();
            $("save-status").textContent = "💾 " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + ":" + String(now.getSeconds()).padStart(2,"0");
        } catch(e) {
            console.error("saveGame:", e);
            $("save-status").textContent = "⚠ Помилка";
        } finally {
            isSaving = false;
        }
    }

    function renderStats() {
        $("stat-coins").textContent = formatNumber(gameState.coins);
        $("stat-clicks").textContent = formatNumber(gameState.totalClicks);
        $("stat-power").textContent = formatNumber(gameState.clickPower);
    }

    window.doClick = function(event) {
        if (!currentUser) return;

        gameState.coins += gameState.clickPower;
        gameState.totalClicks += 1;
        renderStats();

        // Floating text
        const floatEl = document.createElement("div");
        floatEl.className = "float-text";
        floatEl.textContent = "+" + gameState.clickPower;
        const x = (event && event.clientX) || (window.innerWidth / 2);
        const y = (event && event.clientY) || (window.innerHeight / 2);
        floatEl.style.left = x + "px";
        floatEl.style.top = y + "px";
        floatEl.style.transform = "translate(-50%, -50%)";
        document.body.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 800);
    };

    // ===== LOGOUT =====
    window.logout = async function() {
        if (currentUser) {
            await saveGame();
            try { await update(ref(db, `users/${currentUser}`), { lastOnline: Date.now() }); } catch(e) {}
        }
        try {
            localStorage.removeItem("w95_user");
            localStorage.removeItem("w95_hash");
        } catch(e) {}

        currentUser = "";
        gameState = { coins: 0, totalClicks: 0, clickPower: 1 };
        if (saveTimer) { clearInterval(saveTimer); saveTimer = null; }

        $("game-screen").classList.remove("active");
        $("auth-window").style.display = "flex";
        $("auth-username").value = "";
        $("auth-password").value = "";
        $("auth-password2").value = "";
        switchAuthTab("login");
        setStatus("Вихід виконано");
    };

    // Save on page close
    window.addEventListener("beforeunload", () => {
        if (currentUser) {
            // synchronous attempt (best effort)
            try {
                update(ref(db, `users/${currentUser}/clicker`), {
                    coins: gameState.coins,
                    totalClicks: gameState.totalClicks,
                    clickPower: gameState.clickPower
                });
            } catch(e) {}
        }
    });

    // ===== AUTO LOGIN =====
    (async function autoLogin() {
        try {
            const savedUser = localStorage.getItem("w95_user");
            const savedHash = localStorage.getItem("w95_hash");
            if (!savedUser || !savedHash) return;

            const snap = await get(child(ref(db), `users/${savedUser}`));
            if (snap.exists() && snap.val().password === savedHash) {
                currentUser = savedUser;
                try { await update(ref(db, `users/${savedUser}`), { lastOnline: Date.now() }); } catch(e) {}
                startGame();
            } else {
                try {
                    localStorage.removeItem("w95_user");
                    localStorage.removeItem("w95_hash");
                } catch(e) {}
            }
        } catch(e) {
            console.error("autoLogin:", e);
        }
    })();

    // ===== INIT =====
    document.addEventListener("DOMContentLoaded", () => {
        switchAuthTab("login");
        $("auth-username").focus();
        console.log("%cWin95 Clicker v" + APP_VERSION, "color:#000080;font-weight:bold;font-family:monospace;");
    });
</script>
</body>
</html>
