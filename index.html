</div>

<div id="bottom-bar" style="display:none">

</div>

<div id="toast"></div>

<div id="info-modal">

  </div>
</div>

</style>

<script type="module">

// ===== FIREBASE =====
const firebaseConfig = {

// ===== ТРАНСПОРТ =====
const VEHICLES = [

// ===== БУДІВЛІ =====
const BUILDINGS = [
  { id: "center",    x: 500, y: 300, name: "Центр",     icon: "🏛", color: "#f0c040", type: "landmark" },
  { id: "station",   x: 620, y: 380, name: "Вокзал",    icon: "🚂", color: "#e05555", type: "landmark" },

  { id: "autobazar", x: 850, y: 120, name: "Авторинок", icon: "🚗", color: "#3498db", type: "delivery" },
  { id: "warehouse", x: 150, y: 150, name: "Склад",     icon: "📦", color: "#d35400", type: "delivery" },
  { id: "market",    x: 400, y: 350, name: "Ринок",     icon: "🛒", color: "#4a9eff", type: "delivery" },
  { id: "factory",   x: 880, y: 500, name: "Завод",     icon: "🏭", color: "#7f8c8d", type: "delivery" }
];

// ===== ЖИТЛОВІ БУДИНКИ =====
const HOUSES = [
  { id: "h1",  x: 320, y: 180, w: 60, h: 50, price: 1500 },
  { id: "h2",  x: 420, y: 180, w: 60, h: 50, price: 1800 },
  { id: "h3",  x: 560, y: 180, w: 60, h: 50, price: 2200 },
  { id: "h4",  x: 740, y: 250, w: 60, h: 50, price: 2800 },
  { id: "h5",  x: 180, y: 320, w: 60, h: 50, price: 2000 },
  { id: "h6",  x: 300, y: 450, w: 60, h: 50, price: 2500 },
  { id: "h7",  x: 560, y: 450, w: 60, h: 50, price: 3200 },
  { id: "h8",  x: 740, y: 450, w: 60, h: 50, price: 3500 },
  { id: "h9",  x: 200, y: 240, w: 60, h: 50, price: 1800 },
  { id: "h10", x: 820, y: 320, w: 60, h: 50, price: 4000 }
];

// ===== СТАН =====
let me = null;
let myData = { coins: 0, vehicle: 0, delivered: 0, houseId: null };
let myPos = { x: 500, y: 300 };
let otherPlayers = {};
let houseOwners = {};
let keys = {};
let currentOrder = null;
let lastMove = 0;
let camera = { x: 500, y: 300 };
let cameraFollowing = true;

// ===== УТИЛІТИ =====
async function hashPwd(s) {
  const b = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, "0")).join("");
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return Math.floor(n).toString();
}
function toast(msg, dur = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), dur);
}
 // ===== КАРТА КОВЕЛЯ =====
const MAP_W = 1000, MAP_H = 600;

const RIVER = [
  { x: 320, y: 600 }, { x: 340, y: 540 }, { x: 310, y: 480 },
  { x: 330, y: 420 }, { x: 360, y: 370 }, { x: 340, y: 310 },
  { x: 370, y: 250 }, { x: 350, y: 190 }, { x: 380, y: 130 },
  { x: 360, y: 60 },  { x: 390, y: 0 }
];

const RAILWAYS = [
  { x1: 620, y1: 0,   x2: 620, y2: 600 },
  { x1: 620, y1: 300, x2: 200, y2: 300 },
  { x1: 620, y1: 380, x2: 1000, y2: 380 }
];

const ROADS = [
  { x1: 500, y1: 300, x2: 540, y2: 600, w: 16 },
  { x1: 500, y1: 300, x2: 470, y2: 0,   w: 16 },
  { x1: 500, y1: 300, x2: 0,   y2: 320, w: 16 },
  { x1: 500, y1: 300, x2: 1000, y2: 280, w: 16 },
  { x1: 100, y1: 100, x2: 900, y2: 100, w: 12 },
  { x1: 100, y1: 500, x2: 900, y2: 500, w: 12 },
  { x1: 100, y1: 100, x2: 100, y2: 500, w: 12 },
  { x1: 900, y1: 100, x2: 900, y2: 500, w: 12 },
  { x1: 100, y1: 300, x2: 900, y2: 300, w: 10 },
  { x1: 500, y1: 100, x2: 500, y2: 500, w: 10 },
  { x1: 250, y1: 100, x2: 250, y2: 500, w: 6 },
  { x1: 380, y1: 100, x2: 380, y2: 500, w: 6 },
  { x1: 680, y1: 100, x2: 680, y2: 500, w: 6 },
  { x1: 800, y1: 100, x2: 800, y2: 500, w: 6 },
  { x1: 100, y1: 200, x2: 900, y2: 200, w: 6 },
  { x1: 100, y1: 400, x2: 900, y2: 400, w: 6 }
];

const BLOCKS = [];
(function () {
  const XG = [100, 250, 380, 500, 680, 800, 900];
  const YG = [100, 200, 300, 400, 500];
  for (let i = 0; i < XG.length - 1; i++) {
    for (let j = 0; j < YG.length - 1; j++) {
      const bx = XG[i] + 8, by = YG[j] + 8;
      const bw = XG[i + 1] - XG[i] - 16, bh = YG[j + 1] - YG[j] - 16;
      const cx = bx + bw / 2;
      if (cx > 280 && cx < 420) continue;
      BLOCKS.push({ x: bx, y: by, w: bw, h: bh });
    }
  }
})();

const TREES = [];
(function () {
  const seed = [
    [130,140],[160,160],[200,140],[240,280],[280,310],[300,350],
    [380,260],[420,260],[460,260],[540,120],[580,120],
    [640,140],[660,220],[700,340],[740,420],[780,280],
    [820,180],[850,260],[870,340],[260,480],[460,480],
    [560,520],[680,520],[760,520],[860,440],[160,440],
    [240,220],[340,120],[420,140],[700,280],[780,400]
  ];
  seed.forEach(([x, y]) => TREES.push({ x, y, r: 5 + Math.random() * 3 }));
})();

// ===== CANVAS =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let zoom = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  zoom = Math.max(window.innerWidth / MAP_W, window.innerHeight / MAP_H) * 1.15;
}
window.addEventListener("resize", resize);
resize();

// ===== РЕНДЕР =====
function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, w, h);

  const offX = w / 2 - camera.x * zoom;
  const offY = h / 2 - camera.y * zoom;

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(zoom, zoom);

  // Земля
  ctx.fillStyle = "#141414";
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Річка
  ctx.beginPath();
  ctx.moveTo(RIVER[0].x, RIVER[0].y);
  for (let i = 1; i < RIVER.length; i++) ctx.lineTo(RIVER[i].x, RIVER[i].y);
  ctx.strokeStyle = "#1a3a5a";
  ctx.lineWidth = 26;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.strokeStyle = "#1e4a6a";
  ctx.lineWidth = 30;
  ctx.globalAlpha = 0.3;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Квартали
  ctx.fillStyle = "#1c1c1c";
  ctx.strokeStyle = "#262626";
  ctx.lineWidth = 1;
  BLOCKS.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  // Дороги
  ROADS.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.strokeStyle = "#2a2a2a";
    ctx.lineWidth = r.w;
    ctx.lineCap = "round";
    ctx.stroke();
    if (r.w >= 10) {
      ctx.strokeStyle = "#3a3a3a";
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 12]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Залізниця
  RAILWAYS.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Дерева
  TREES.forEach(t => {
    ctx.fillStyle = "#1e3a1e";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2a4a2a";
    ctx.beginPath();
    ctx.arc(t.x - 1, t.y - 1, t.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });

  // Будинки гравців
  HOUSES.forEach(h => {
    const owner = houseOwners[h.id];
    const isMine = owner && owner.owner === me;
    const isOther = owner && owner.owner !== me;

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(h.x + 3, h.y + 3, h.w, h.h);

    if (isMine) {
      ctx.fillStyle = "#2a4a2a";
      ctx.strokeStyle = "#4ade80";
    } else if (isOther) {
      ctx.fillStyle = "#1a1a2e";
      ctx.strokeStyle = "#4a9eff";
    } else {
      ctx.fillStyle = "#2a2a2a";
      ctx.strokeStyle = "#444";
    }
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.lineWidth = 2;
    ctx.strokeRect(h.x, h.y, h.w, h.h);

    // Дах
    ctx.beginPath();
    ctx.moveTo(h.x - 4, h.y);
    ctx.lineTo(h.x + h.w / 2, h.y - 14);
    ctx.lineTo(h.x + h.w + 4, h.y);
    ctx.closePath();
    ctx.fillStyle = isMine ? "#3a6a3a" : isOther ? "#2a2a4e" : "#3a3a3a";
    ctx.fill();
    ctx.strokeStyle = isMine ? "#4ade80" : isOther ? "#4a9eff" : "#555";
    ctx.stroke();

    // Вікно
    ctx.fillStyle = isMine ? "#f0c040" : isOther ? "#666" : "#444";
    ctx.fillRect(h.x + h.w / 2 - 5, h.y + h.h / 2 - 5, 10, 10);

    // Підпис
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    if (owner) {
      ctx.fillStyle = isMine ? "#4ade80" : "#4a9eff";
      ctx.fillText("Дім (" + owner.owner + ")", h.x + h.w / 2, h.y + h.h + 4);
    } else {
      ctx.fillStyle = "#666";
      ctx.fillText(fmt(h.price) + " 💰", h.x + h.w / 2, h.y + h.h + 4);
    }
  });

  // Орієнтири / доставка
  BUILDINGS.forEach(b => {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.arc(b.x + 2, b.y + 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";

 // ===== КАРТА КОВЕЛЯ =====
const MAP_W = 1000, MAP_H = 600;

  { x: 320, y: 600 }, { x: 340, y: 540 }, { x: 310, y: 480 },

  { x: 360, y: 60 },  { x: 390, y: 0 }
];

const RAILWAYS = [
  { x1: 620, y1: 0,   x2: 620, y2: 600 },

  { x1: 620, y1: 380, x2: 1000, y2: 380 }
];

const ROADS = [
  { x1: 500, y1: 300, x2: 540, y2: 600, w: 16 },
  { x1: 500, y1: 300, x2: 470, y2: 0,   w: 16 },
  { x1: 500, y1: 300, x2: 0,   y2: 320, w: 16 },
  { x1: 500, y1: 300, x2: 1000, y2: 280, w: 16 },

  { x1: 100, y1: 400, x2: 900, y2: 400, w: 6 }
];

const BLOCKS = [];
(function () {
  const XG = [100, 250, 380, 500, 680, 800, 900];
  const YG = [100, 200, 300, 400, 500];
  for (let i = 0; i < XG.length - 1; i++) {
    for (let j = 0; j < YG.length - 1; j++) {
      const bx = XG[i] + 8, by = YG[j] + 8;
      const bw = XG[i + 1] - XG[i] - 16, bh = YG[j + 1] - YG[j] - 16;
      const cx = bx + bw / 2;
      if (cx > 280 && cx < 420) continue;
      BLOCKS.push({ x: bx, y: by, w: bw, h: bh });

  seed.forEach(([x, y]) => TREES.push({ x, y, r: 5 + Math.random() * 3 }));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let zoom = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  zoom = Math.max(window.innerWidth / MAP_W, window.innerHeight / MAP_H) * 1.15;
}
window.addEventListener("resize", resize);

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, w, h);

  const offX = w / 2 - camera.x * zoom;
  const offY = h / 2 - camera.y * zoom;

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(zoom, zoom);

  // Земля
  ctx.fillStyle = "#141414";
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Річка
  ctx.beginPath();
  ctx.moveTo(RIVER[0].x, RIVER[0].y);
  for (let i = 1; i < RIVER.length; i++) ctx.lineTo(RIVER[i].x, RIVER[i].y);
  ctx.strokeStyle = "#1a3a5a";
  ctx.lineWidth = 26;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.strokeStyle = "#1e4a6a";
  ctx.lineWidth = 30;
  ctx.globalAlpha = 0.3;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Квартали
  ctx.fillStyle = "#1c1c1c";
  ctx.strokeStyle = "#262626";
  ctx.lineWidth = 1;
  BLOCKS.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  // Дороги
  ROADS.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.strokeStyle = "#2a2a2a";
    ctx.lineWidth = r.w;
    ctx.lineCap = "round";
    ctx.stroke();
    if (r.w >= 10) {
      ctx.strokeStyle = "#3a3a3a";
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 12]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Залізниця
  RAILWAYS.forEach(r => {
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Дерева
  TREES.forEach(t => {
    ctx.fillStyle = "#1e3a1e";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2a4a2a";
    ctx.beginPath();
    ctx.arc(t.x - 1, t.y - 1, t.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });

  // Будинки гравців
  HOUSES.forEach(h => {
    const owner = houseOwners[h.id];
    const isMine = owner && owner.owner === me;
    const isOther = owner && owner.owner !== me;

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(h.x + 3, h.y + 3, h.w, h.h);

    if (isMine) {
      ctx.fillStyle = "#2a4a2a";
      ctx.strokeStyle = "#4ade80";
    } else if (isOther) {
      ctx.fillStyle = "#1a1a2e";
      ctx.strokeStyle = "#4a9eff";
    } else {
      ctx.fillStyle = "#2a2a2a";
      ctx.strokeStyle = "#444";
    }
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.lineWidth = 2;
    ctx.strokeRect(h.x, h.y, h.w, h.h);

    // Дах
    ctx.beginPath();
    ctx.moveTo(h.x - 4, h.y);
    ctx.lineTo(h.x + h.w / 2, h.y - 14);
    ctx.lineTo(h.x + h.w + 4, h.y);
    ctx.closePath();
    ctx.fillStyle = isMine ? "#3a6a3a" : isOther ? "#2a2a4e" : "#3a3a3a";
    ctx.fill();
    ctx.strokeStyle = isMine ? "#4ade80" : isOther ? "#4a9eff" : "#555";
    ctx.stroke();

    // Вікно
    ctx.fillStyle = isMine ? "#f0c040" : isOther ? "#666" : "#444";
    ctx.fillRect(h.x + h.w / 2 - 5, h.y + h.h / 2 - 5, 10, 10);

    // Підпис
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    if (owner) {
      ctx.fillStyle = isMine ? "#4ade80" : "#4a9eff";
      ctx.fillText("Дім (" + owner.owner + ")", h.x + h.w / 2, h.y + h.h + 4);
    } else {
      ctx.fillStyle = "#666";
      ctx.fillText(fmt(h.price) + " 💰", h.x + h.w / 2, h.y + h.h + 4);
    }
  });

  // Орієнтири / доставка
  BUILDINGS.forEach(b => {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.arc(b.x + 2, b.y + 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.icon, b.x, b.y);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "bold 9px sans-serif";
    ctx.textBaseline = "bottom";
    ctx.fillText(b.name, b.x, b.y - 18);
  });

  // Активне замовлення
  if (currentOrder) {
    const t = currentOrder.target;
    const pulse = Math.sin(Date.now() / 300) * 0.3 + 1;
    ctx.strokeStyle = "#f0c040";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 22 * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(240,192,64,0.3)";
    ctx.beginPath();
    ctx.arc(t.x, t.y, 30 * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Інші гравці
  Object.entries(otherPlayers).forEach(([name, p]) => {
    const v = VEHICLES[p.vehicle] || VEHICLES[0];
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.arc(p.x + 1, p.y + 1, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4a9eff";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(v.icon, p.x, p.y);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "9px sans-serif";
    ctx.textBaseline = "bottom";
    ctx.fillText(name, p.x, p.y - 12);
  });

  // Я
  const myV = VEHICLES[myData.vehicle];
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.arc(myPos.x + 2, myPos.y + 2, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = myV.color;
  ctx.beginPath();
  ctx.arc(myPos.x, myPos.y, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(myV.icon, myPos.x, myPos.y);
  ctx.fillStyle = "#f0c040";
  ctx.font = "bold 10px sans-serif";
  ctx.textBaseline = "bottom";
  ctx.fillText(me || "", myPos.x, myPos.y - 16);

  ctx.restore();
}
 // ===== FIREBASE SYNC =====
let posInterval = null;

function startGame() {
  const myRef = ref(db, "online/" + me);
  set(myRef, {
    x: Math.round(myPos.x), y: Math.round(myPos.y),
    vehicle: myData.vehicle, lastSeen: Date.now()
  });
  onDisconnect(myRef).remove();

  // Інші гравці
  onValue(ref(db, "online"), snap => {
    otherPlayers = {};
    if (snap.exists()) {
      const now = Date.now();
      Object.entries(snap.val()).forEach(([name, data]) => {
        if (name !== me && now - (data.lastSeen || 0) < 30000) {
          otherPlayers[name] = data;
        }
      });
    }
  });

  // Власники домів
  onValue(ref(db, "houses"), snap => {
    houseOwners = snap.exists() ? snap.val() : {};
  });

  if (posInterval) clearInterval(posInterval);
  posInterval = setInterval(() => {
    if (!me) return;
    update(ref(db, "online/" + me), {
      x: Math.round(myPos.x), y: Math.round(myPos.y),
      vehicle: myData.vehicle, lastSeen: Date.now()
    });
  }, 150);

  setInterval(savePlayer, 5000);
}

// ===== РУХ =====
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) {
    keys[k] = true;
    e.preventDefault();
  }
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function updateMove(dt) {
  let dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    const spd = VEHICLES[myData.vehicle].speed;
    myPos.x += (dx / len) * spd * dt;
    myPos.y += (dy / len) * spd * dt;
    myPos.x = Math.max(20, Math.min(MAP_W - 20, myPos.x));
    myPos.y = Math.max(20, Math.min(MAP_H - 20, myPos.y));
    lastMove = Date.now();
    if (cameraFollowing) {
      camera.x = myPos.x;
      camera.y = myPos.y;
    }
  } else if (cameraFollowing) {
    camera.x += (myPos.x - camera.x) * 0.15;
    camera.y += (myPos.y - camera.y) * 0.15;
  }
}

// ===== ЗАМОВЛЕННЯ =====
function spawnOrder() {
  const deliveryPoints = BUILDINGS.filter(b => b.type === "delivery");
  const available = deliveryPoints.filter(b => dist(myPos, b) > 80);
  if (!available.length) { currentOrder = null; return; }
  const target = available[Math.floor(Math.random() * available.length)];
  const d = dist(myPos, target);
  const reward = Math.floor(30 + d * 0.4 + Math.random() * 40);
  currentOrder = { target, reward, spawnedAt: Date.now() };

  document.getElementById("order-panel").classList.add("active");
  document.getElementById("order-target").textContent = target.icon + " " + target.name;
  document.getElementById("order-reward").textContent = "+" + reward + " 💰";
  updateOrderDistance();
}

function updateOrderDistance() {
  if (!currentOrder) return;
  const d = dist(myPos, currentOrder.target);
  document.getElementById("order-dist").textContent = Math.round(d) + " м";
}

async function checkDelivery() {
  if (!currentOrder) return;
  const d = dist(myPos, currentOrder.target);
  if (d < 30) {
    myData.coins += currentOrder.reward;
    myData.delivered += 1;
    updateHUD();
    toast("✅ Доставлено в " + currentOrder.target.name + "! +" + currentOrder.reward + " 💰");
    currentOrder = null;
    document.getElementById("order-panel").classList.remove("active");
    await savePlayer();
    setTimeout(spawnOrder, 800);
  }
}

// ===== ЦИКЛ =====
let lastT = 0;
let orderDistTimer = 0;

function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.1);
  lastT = t;
  updateMove(dt);
  checkDelivery();
  draw();
  if (t - orderDistTimer > 200) {
    updateOrderDistance();
    orderDistTimer = t;
  }
  requestAnimationFrame(loop);
}
 // ===== AUTO LOGIN =====
(async function autoLogin() {
  try {
    const u = localStorage.getItem("kd_user");
    const h = localStorage.getItem("kd_hash");
    if (!u || !h) return;
    const snap = await get(ref(db, "users/" + u));
    if (snap.exists() && snap.val().password === h) {
      myData = {
        coins: snap.val().coins || 0,
        vehicle: snap.val().vehicle || 0,
        delivered: snap.val().delivered || 0,
        houseId: snap.val().houseId || null
      };
      myPos = { x: snap.val().x || 500, y: snap.val().y || 300 };
      me = u;
      startGameUI();
    } else {
      localStorage.removeItem("kd_user");
      localStorage.removeItem("kd_hash");
    }
  } catch (e) { console.error(e); }
})();

// ===== INIT =====
document.getElementById("username").focus();
requestAnimationFrame(loop);
